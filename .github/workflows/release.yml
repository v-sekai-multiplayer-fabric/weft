# Dev-stage release of weft (RFD 0067: dev, then beta, then rc). Test, wrap the BEAM
# release, package an RPM with fpm, and chunk it with
# desync. In production the chunk store is SQLite to FoundationDB served over an
# on-demand H3/WebTransport endpoint; here the chunks back the release assets.
name: dev release

on:
  push:
    tags: ["v*-dev.*", "v*-beta.*", "v*-rc.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Install FoundationDB client
        run: |
          curl -fsSL -o /tmp/fdb-clients.deb "https://github.com/apple/foundationdb/releases/download/7.3.76/foundationdb-clients_7.3.76-1_amd64.deb"
          sudo dpkg -i /tmp/fdb-clients.deb

      - run: mix deps.get
      # :fdb and :desync tests auto-exclude when the tools are absent.
      - run: mix test

  release:
    needs: test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Install FoundationDB client
        run: |
          curl -fsSL -o /tmp/fdb-clients.deb "https://github.com/apple/foundationdb/releases/download/7.3.76/foundationdb-clients_7.3.76-1_amd64.deb"
          sudo dpkg -i /tmp/fdb-clients.deb

      - run: mix deps.get

      # Standard OTP release. It bundles ERTS, so it is self-contained. No Burrito, no zig.
      - name: build the release
        run: |
          mix release weft
          tar czf weft-release.tar.gz -C _build/prod/rel weft

      - name: package an RPM with fpm
        run: |
          sudo gem install --no-document fpm
          version="${GITHUB_REF_NAME#v}"
          fpm -s dir -t rpm -n weft -v "${version:-0.0.0-dev}" \
            _build/prod/rel/weft=/opt/weft/rel

      - name: chunk the release with desync
        run: |
          go install github.com/folbricht/desync/cmd/desync@latest
          "$(go env GOPATH)/bin/desync" make --store chunks weft.caibx weft-release.tar.gz

      - name: publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.rpm
            weft.caibx
