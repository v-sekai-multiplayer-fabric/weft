# Run the test suite on every pull request and on pushes to main. FoundationDB is
# installed so the erlfdb NIF compiles (it needs foundationdb/fdb_c.h and libfdb_c)
# and the :fdb tests run against a real single-node cluster. The :desync tests
# auto-exclude when that tool is absent.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FDB_VERSION: "7.3.76"
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20-29-${{ hashFiles('mix.lock') }}

      - name: Install FoundationDB
        run: |
          curl -fsSL -o /tmp/fdb-clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          curl -fsSL -o /tmp/fdb-server.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-server_${FDB_VERSION}-1_amd64.deb"
          sudo dpkg -i /tmp/fdb-clients.deb /tmp/fdb-server.deb
          # The server package's postinst starts a single-node cluster. Wait for it.
          for i in $(seq 1 30); do
            fdbcli --exec 'status minimal' | grep -q 'The database is available' && break
            sleep 2
          done
          fdbcli --exec 'status minimal'

      - run: mix deps.get
      - run: mix test
