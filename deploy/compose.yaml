# Docker Compose for weft on Docker Desktop (Windows) or Docker on Linux.
#
#   docker compose -f deploy/compose.yaml up --build
#
# It starts FoundationDB, configures a single-node database once, then runs weft. It
# also runs versitygw as the S3-compatible cold tier and backs FoundationDB up to it.
# The FoundationDB services share one volume that holds the cluster file.
services:
  fdb:
    image: foundationdb/foundationdb:7.3.76
    environment:
      FDB_NETWORKING_MODE: container
    volumes:
      - fdb:/var/fdb

  # Configure the database one time. The step is safe to run again.
  #
  # This waits for the server itself. A healthcheck on `fdb` cannot gate this step,
  # because `status minimal` reports the database as unavailable until `configure new`
  # runs, and `configure new` runs here. A healthcheck would deadlock the first start.
  #
  # The step is idempotent. `configure new` fails when the database exists, so the loop
  # tests availability first and exits 0 when the database is already configured.
  fdb-init:
    image: foundationdb/foundationdb:7.3.76
    depends_on:
      fdb:
        condition: service_started
    volumes:
      - fdb:/var/fdb
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        for i in $(seq 1 60); do
          if fdbcli -C /var/fdb/fdb.cluster --exec 'status minimal' 2>/dev/null \
             | grep -q 'The database is available'; then
            echo "FoundationDB is available."
            exit 0
          fi
          fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single memory' >/dev/null 2>&1 || true
          sleep 2
        done
        echo "FoundationDB did not become available."
        exit 1

  weft:
    build:
      context: ..
      dockerfile: deploy/Containerfile
      # The dev target keeps mix and the sources, so `mix test` and the benches run.
      target: dev
    depends_on:
      fdb-init:
        condition: service_completed_successfully
    environment:
      WEFT_FDB_CLUSTER_FILE: /var/fdb/fdb.cluster
    volumes:
      - fdb:/var/fdb
    # The client WebTransport and HTTP/3 port.
    ports:
      - "4000:4000"

  # The S3-compatible cold tier. versitygw turns a local directory into an S3 server.
  # FoundationDB backs up to it. See docs/reference/store.md.
  versitygw:
    image: ghcr.io/versity/versitygw:latest
    environment:
      ROOT_ACCESS_KEY: weft
      ROOT_SECRET_KEY: weftsecret
    command: ["--port", ":7070", "posix", "/data"]
    volumes:
      - s3:/data
    ports:
      - "7070:7070"

  # Continuous FoundationDB backup to versitygw. This is the SQLite to FDB to S3 tier.
  fdb-backup:
    image: foundationdb/foundationdb:7.3.76
    depends_on:
      fdb-init:
        condition: service_completed_successfully
      versitygw:
        condition: service_started
    volumes:
      - fdb:/var/fdb
    restart: on-failure
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        dest='blobstore://weft:weftsecret@versitygw:7070/fdb?bucket=fdb-backup&secure_connection=0&region=us-east-1'
        backup_agent -C /var/fdb/fdb.cluster --log --logdir /var/log/foundationdb &
        sleep 3
        fdbbackup start -C /var/fdb/fdb.cluster -d "$dest" -z || true
        wait

volumes:
  fdb: {}
  s3: {}
