# The S3-compatible cold tier. FoundationDB backs up to it with fdbbackup. See
# docs/store.md.
#
# versitygw is not a plane and not an edge. It is a third-party server, so it keeps its
# own name.
apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: weft
spec:
  selector:
    app: versitygw
  ports:
    - name: s3
      port: 7070
      targetPort: 7070
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versitygw
  namespace: weft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: versitygw
  template:
    metadata:
      labels:
        app: versitygw
    spec:
      containers:
        - name: versitygw
          image: ghcr.io/versity/versitygw:latest
          args: ["--port", ":7070", "posix", "/data"]
          env:
            # Development values. Use a Secret for a real cluster.
            - name: ROOT_ACCESS_KEY
              value: weft
            - name: ROOT_SECRET_KEY
              value: weftsecret
          ports:
            - containerPort: 7070
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
