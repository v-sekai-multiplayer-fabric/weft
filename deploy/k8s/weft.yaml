# The control plane, and the headless Service that lets the BEAM nodes find each other.
#
# The Pod is the machine. A plane and an edge become more containers in this Pod, and
# they share the /dev/shm volume below as the iceoryx segment. Neither is built yet, so
# this Pod holds the control plane only. See README.md.
apiVersion: v1
kind: Service
metadata:
  name: weft-headless
  namespace: weft
spec:
  clusterIP: None
  # libcluster reads the A records of this Service. A node must appear before it reports
  # ready, or no node can ever join and become ready.
  publishNotReadyAddresses: true
  selector:
    app: weft
  ports:
    - name: epmd
      port: 4369
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weft
  namespace: weft
spec:
  replicas: 3
  # One weft node for each machine, so a rolling update has nowhere to put a fourth Pod
  # and it waits forever. Recreate stops the old Pods first. A world Pod is one Pod and
  # accepts the loss, so this matches how a world behaves. See docs/topology.md.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weft
  template:
    metadata:
      labels:
        app: weft
    spec:
      # One weft node for each worker node. Two nodes on one worker would still cluster,
      # but then a lost worker proves nothing about handoff to a different machine.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: weft
              topologyKey: kubernetes.io/hostname
      containers:
        - name: weft
          # The OTP release, the same artifact release-native.yml builds.
          #   docker build -f deploy/Containerfile --target release -t weft:release .
          image: weft:release
          imagePullPolicy: IfNotPresent
          env:
            # Discovery. libcluster starts only when this is set, so a local run and a
            # test run stay on one node with no branch in the code.
            - name: WEFT_K8S_SERVICE
              value: weft-headless
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # A BEAM node is named when the VM starts, before any application runs, so
            # libcluster cannot name it. libcluster builds each peer name as
            # `<application_name>@<pod ip>`, so this node must use the same form. An OTP
            # release reads both variables, and Kubernetes expands $(POD_IP) here.
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: RELEASE_NODE
              value: weft@$(POD_IP)
            # Every node needs the same cookie. Use a Secret for a real cluster.
            - name: RELEASE_COOKIE
              value: weft-dev-cookie
            # The operator writes this file into the ConfigMap mounted below.
            - name: WEFT_FDB_CLUSTER_FILE
              value: /var/fdb/cluster-file
          volumeMounts:
            - name: fdb-config
              mountPath: /var/fdb
              readOnly: true
            # The iceoryx segment. Every container in this Pod mounts it, so a plane and
            # an edge share memory with no copy. A container gets its own 64 MB /dev/shm
            # without this, and iceoryx would not find the segment.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: fdb-config
          configMap:
            name: weft-fdb-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
