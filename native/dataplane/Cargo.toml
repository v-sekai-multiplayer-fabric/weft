[package]
name = "weft-dataplane"
version = "0.1.0"
edition = "2021"
description = "weft data plane: a thread-per-core seqlock ring, cross-platform"
license = "MIT OR Apache-2.0"

[dependencies]
core_affinity = "0.8"

[[bin]]
name = "weft-dataplane"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
