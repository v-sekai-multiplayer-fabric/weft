app            = "zone-server-h2o-mud-test"
primary_region = "iad"

# Throwaway test app, held strictly inside Fly's Hobby-plan free
# allowance: shared-cpu-1x, 256mb, no dedicated IPv4 allocated (that
# is a separate paid feature, not part of the free allowance).
# Tradeoff, stated plainly: without a dedicated IPv4, real external
# UDP reachability cannot be proven from outside the VM -- this test
# only confirms the build, FDB, and zone-server-h2o itself actually
# start and bind their sockets on real Fly infrastructure. Torn down
# after the test.

[build]
  dockerfile = "fly/Containerfile"

[env]
  ZONE_PORT         = "7443"
  FDB_PROCESS_COUNT = "1"
  ZONE_COUNT        = "1"
  # BACKUP_SLOTS / BACKUP_INTERVAL_SECONDS: real defaults live in
  # fly/entrypoint.sh (4 slots, 21600s = 4x/day), overridable here.
  # TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY are secrets, not
  # env vars -- set once via `flyctl storage create` (mints a real
  # Tigris bucket + credentials) then `flyctl secrets set
  # TIGRIS_ACCESS_KEY_ID=... TIGRIS_SECRET_ACCESS_KEY=...`, not set
  # here. Backups are skipped entirely (see entrypoint.sh) if unset.

[[services]]
  internal_port        = 7443
  protocol             = "udp"
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  [[services.ports]]
    port = 7443

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
